name: release (legacy v1 Go binary)

# MANUAL ONLY, on purpose. This builds the v1 Go installer, which installs
# superpowers and agent-browser - tools v2 deliberately does not ship. A v* tag
# must publish the npm package (npm-publish.yml), not this. Run it by hand only
# if you intend to cut a v1 binary release.
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-go@v5
        with: { go-version-file: go.mod }
      - run: go test ./...
      - uses: goreleaser/goreleaser-action@v7
        with: { args: release --clean }
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAP_GITHUB_TOKEN: ${{ secrets.TAP_GITHUB_TOKEN }}
