name: npm publish

# Publishes golden-rules to npm when a v* tag is pushed.
#
# Uses npm trusted publishing (OIDC): no NPM_TOKEN secret exists to leak or
# rotate. Before the first release, add this repo + workflow as a trusted
# publisher on the package's npm settings page.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  id-token: write   # required for OIDC
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Trusted publishing needs npm >= 11.5.1 and Node >= 22.14.0.
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"

      - run: npm install -g npm@latest
      - run: npm --version

      - name: Test
        run: npm test

      # The tag must match the version in package.json, or a mistagged release
      # publishes the wrong version under the right name.
      - name: Tag must match package.json version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg="$(node -p "require('./package.json').version")"
          if [ "$tag" != "$pkg" ]; then
            echo "tag v$tag does not match package.json $pkg" >&2
            exit 1
          fi
          echo "publishing $pkg"

      - name: Publish
        run: npm publish
